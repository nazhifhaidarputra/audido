[package]
name = "audido-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
biquad = "0.5.0"
realfft = "3.5.0"
# rodio used ONLY for audio file decoding (Decoder) and utilities — NOT for audio output
rodio = { version = "0.21.1", features = ['symphonia-all'] }
rubato = "1.0.0"
audioadapter-buffers = "2.0"
rustfft = "6.4.1"
symphonia = "0.5.5"
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
thiserror = "2.0.18"
crossbeam-channel = "0.5.15"
youtube_dl = "0.10.0"
lofty = "0.22.4"
rand = "0.9"
strum = { version = "0.27", features = ["derive"] }
pitch-detection = "0.3.0"
# SPSC heap ringbuffer for real-time audio sample passing
ringbuf = "0.5.1"
# CPAL: low-level cross-platform audio I/O for the output stream
cpal = "0.15"
apodize = "1.0.0"
yt-dlp = "2.8.3"
