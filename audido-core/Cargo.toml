[package]
name = "audido-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
biquad = "0.5.0"
realfft = "3.5.0"
# rodio used ONLY for audio file decoding (Decoder) and utilities — NOT for audio output
rodio = { version = "0.21", features = ['symphonia-all','mp4'] }
rubato = "5.0.0"
audioadapter-buffers = "5.2.0"
rustfft = "6.4.1"
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
thiserror = "2.0.18"
crossbeam-channel = "0.5.15"
youtube_dl = "0.10.0"
lofty = "0.22.4"
rand = "0.9"
strum = { version = "0.27", features = ["derive"] }
pitch-detection = "0.3.0"
# SPSC heap ringbuffer for real-time audio sample passing
ringbuf = "0.5.1"
# CPAL: low-level cross-platform audio I/O for the output stream
cpal = "0.15"
apodize = "1.0.0"
yt-dlp = "2.8.3"
stream-download = {version = "0.24.3", features=['process']}
dirs = "6"
tempfile = { workspace = true}
reqwest = {workspace = true}
futures.workspace = true

[dev-dependencies]
env_logger = { workspace = true }
ctor.workspace = true
